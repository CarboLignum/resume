<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denis Kuznetsov</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --dim:rgba(245,245,247,.55);
    --faint:rgba(245,245,247,.28);
    --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.045);
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:grid;
    grid-template-rows:auto 1fr;
    background:
      radial-gradient(120% 90% at 50% 42%, #141414 0%, #060606 45%, #000 78%);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:clamp(14px,2.2vh,26px) clamp(18px,3.5vw,52px);
    z-index:5;
  }
  .name{
    font-size:clamp(12px,1.15vw,15px);
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
  }

  .nav{display:flex;align-items:center;gap:clamp(12px,1.6vw,24px)}
  .lang{
    display:flex;align-items:center;gap:.5em;
    font-size:clamp(11px,1.02vw,13px);
    font-weight:500;letter-spacing:.1em;
  }
  .lang a{color:var(--faint);text-decoration:none;transition:color .3s ease}
  .lang a:hover{color:var(--dim)}
  .lang a.on{color:var(--ink)}
  .lang span{color:rgba(255,255,255,.16)}

  .cv{
    display:inline-flex;
    align-items:center;
    gap:.55em;
    padding:.62em 1.35em;
    font-size:clamp(11px,1.02vw,13.5px);
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:100px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    transition:background .35s ease,border-color .35s ease,transform .35s ease;
  }
  .cv:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}

  .stage{
    position:relative;
    display:grid;
    grid-template-columns:1fr minmax(300px,24vw);
    align-items:center;
    min-height:0;
    padding:0 clamp(18px,3.5vw,52px) clamp(10px,1.6vh,22px);
    gap:clamp(16px,2vw,40px);
  }

  .figure{
    position:relative;
    height:100%;
    min-height:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .figure img{
    height:100%;
    width:auto;
    max-width:none;
    object-fit:contain;
    object-position:bottom center;
    display:block;
    -webkit-mask-image:radial-gradient(ellipse 52% 92% at 50% 47%, #000 52%, rgba(0,0,0,.6) 78%, transparent 100%);
    mask-image:radial-gradient(ellipse 52% 92% at 50% 47%, #000 52%, rgba(0,0,0,.6) 78%, transparent 100%);
    animation:rise 1.4s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(1.012)}to{opacity:1;transform:none}}

  .panel{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:clamp(16px,1.5vw,24px);
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(140%);
    backdrop-filter:blur(30px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    max-height:min(62vh,540px);
    animation:rise 1.4s .18s cubic-bezier(.16,1,.3,1) both;
  }
  .panel h2{
    font-size:clamp(10.5px,.9vw,12px);
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--faint);
  }

  .log{
    flex:1;
    min-height:120px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    font-size:clamp(13px,1.02vw,15px);
    line-height:1.55;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.18) transparent;
  }
  .log::-webkit-scrollbar{width:5px}
  .log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}

  .msg{max-width:100%}
  .msg.me{color:var(--dim)}
  .msg.me::before{content:"—  ";color:var(--faint)}
  .msg.ai{color:var(--ink)}

  .composer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 6px 6px 16px;
    border:1px solid var(--line);
    border-radius:100px;
    background:rgba(0,0,0,.35);
  }
  .composer input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:clamp(13px,1.02vw,15px);
    padding:8px 0;
  }
  .composer input::placeholder{color:var(--faint)}

  .mic{
    flex:none;
    width:42px;height:42px;
    display:grid;place-items:center;
    border:0;
    border-radius:50%;
    background:var(--ink);
    color:#000;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease;
  }
  .mic:hover{transform:scale(1.06)}
  .mic svg{width:19px;height:19px}
  .mic.live{
    background:#ff453a;color:#fff;
    box-shadow:0 0 0 0 rgba(255,69,58,.55);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 16px rgba(255,69,58,0)}
    100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}
  }

  .hint{
    font-size:clamp(10.5px,.85vw,12px);
    letter-spacing:.04em;
    color:var(--faint);
    text-align:center;
  }

  @media (max-width:900px){
    .stage{
      grid-template-columns:1fr;
      grid-template-rows:1fr auto;
      align-items:stretch;
    }
    .figure img{
      -webkit-mask-image:radial-gradient(86% 80% at 50% 42%, #000 55%, transparent 100%);
      mask-image:radial-gradient(86% 80% at 50% 42%, #000 55%, transparent 100%);
    }
    .panel{max-height:44vh}
    .log{min-height:64px}
  }
</style>
</head>
<body>

<header>
  <div class="name">Denis Kuznetsov</div>
  <div class="nav">
    <div class="lang">
      <a href="index.html">FI</a><span>·</span><a class="on" href="index-en.html">EN</a>
    </div>
    <a class="cv" href="cv-en.html">CV</a>
  </div>
</header>

<main class="stage">

  <div class="figure">
    <img src="avatar.png" alt="Denis Kuznetsov">
  </div>

  <section class="panel">
    <h2>Ask me</h2>

    <div class="log" id="log">
      <div class="msg ai">Hi. Ask anything about what I do — speak or type, in any language you like.</div>
    </div>

    <form class="composer" id="form">
      <input id="q" type="text" autocomplete="off" placeholder="Type your question…">
      <button class="mic" id="mic" type="button" aria-label="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3.5"/>
        </svg>
      </button>
    </form>

    <div class="hint" id="hint">Press the microphone and speak</div>
  </section>

</main>

<script>
  const log  = document.getElementById('log');
  const form = document.getElementById('form');
  const q    = document.getElementById('q');
  const mic  = document.getElementById('mic');
  const hint = document.getElementById('hint');

  function say(text, who){
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  const WORKER = 'https://round-scene-4de7.carbo-lignum.workers.dev';

  const history = [];
  let busy = false;

  async function ask(text){
    text = text.trim();
    if(!text || busy) return;

    say(text, 'me');
    history.push({role:'me', text});
    q.value = '';

    busy = true;
    const dots = document.createElement('div');
    dots.className = 'msg ai';
    dots.style.opacity = '.45';
    dots.textContent = '…';
    log.appendChild(dots);
    log.scrollTop = log.scrollHeight;

    try{
      const r = await fetch(WORKER, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message:text, history: history.slice(0,-1) })
      });
      const d = await r.json();
      dots.remove();
      if(d.reply){
        say(d.reply, 'ai');
        history.push({role:'ai', text:d.reply});
      } else {
        say('The connection is down right now. Write directly: carbo.lignum@gmail.com', 'ai');
      }
    }catch(err){
      dots.remove();
      say('The connection is down right now. Write directly: carbo.lignum@gmail.com', 'ai');
    }finally{
      busy = false;
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, live = false;

  if(!SR){
    hint.textContent = 'Voice input works in Chrome';
  } else {
    rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;

    rec.onstart  = () => { live = true;  mic.classList.add('live');    hint.textContent = 'Listening…'; };
    rec.onend    = () => { live = false; mic.classList.remove('live'); hint.textContent = 'Press the microphone and speak'; };
    rec.onerror  = () => { live = false; mic.classList.remove('live'); hint.textContent = 'Microphone unavailable'; };

    rec.onresult = e => {
      let txt = '';
      for(const r of e.results) txt += r[0].transcript;
      q.value = txt;
      if(e.results[e.results.length - 1].isFinal) ask(txt);
    };

    mic.addEventListener('click', () => {
      if(live){ rec.stop(); return; }
      rec.lang = navigator.language || 'en-US';
      try{ rec.start(); }catch(err){}
    });
  }
</script>

</body>
</html>
