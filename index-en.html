<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denis Kuznetsov</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --dim:rgba(245,245,247,.55);
    --faint:rgba(245,245,247,.28);
    --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.045);
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    /* 100% на мобильном считается от полного окна, а адресная строка
       съедает низ — панель уезжает за экран. dvh меряет то, что видно. */
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:grid;
    grid-template-rows:auto 1fr;
    /* мягкое свечение из центра — свет как на фото */
    background:
      radial-gradient(120% 90% at 50% 42%, #141414 0%, #060606 45%, #000 78%);
  }

  /* ---------- шапка ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:clamp(14px,2.2vh,26px) clamp(18px,3.5vw,52px);
    z-index:5;
  }
  .name{
    font-size:clamp(12px,1.15vw,15px);
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .nav{display:flex;align-items:center;gap:clamp(12px,1.6vw,24px)}
  .lang{
    display:flex;align-items:center;gap:.5em;
    font-size:clamp(11px,1.02vw,13px);
    font-weight:500;letter-spacing:.1em;
  }
  .lang a{color:var(--faint);text-decoration:none;transition:color .3s ease}
  .lang a:hover{color:var(--dim)}
  .lang a.on{color:var(--ink)}
  .lang span{color:rgba(255,255,255,.16)}

  .cv{
    display:inline-flex;
    align-items:center;
    gap:.55em;
    padding:.62em 1.35em;
    font-size:clamp(11px,1.02vw,13.5px);
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:100px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    transition:background .35s ease,border-color .35s ease,transform .35s ease;
  }
  .cv:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}

  /* ---------- сцена ---------- */
  .stage{
    position:relative;
    display:grid;
    grid-template-columns:1fr minmax(300px,24vw);
    align-items:center;
    min-height:0;
    padding:0 clamp(18px,3.5vw,52px) clamp(10px,1.6vh,22px);
    gap:clamp(16px,2vw,40px);
  }

  /* фото — во всю доступную высоту, растворяется в фоне */
  .figure{
    position:relative;
    height:100%;
    min-height:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .figure img{
    height:100%;
    width:auto;
    max-width:none;
    object-fit:contain;
    object-position:bottom center;
    display:block;
    /* растушёвка только по бокам и низу — фигура остаётся целой,
       а квадратный край кадра не читается на чёрном фоне */
    -webkit-mask-image:radial-gradient(ellipse 52% 92% at 50% 47%, #000 52%, rgba(0,0,0,.6) 78%, transparent 100%);
    mask-image:radial-gradient(ellipse 52% 92% at 50% 47%, #000 52%, rgba(0,0,0,.6) 78%, transparent 100%);
    animation:rise 1.4s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(1.012)}to{opacity:1;transform:none}}

  /* ---------- панель диалога ---------- */
  .panel{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:clamp(16px,1.5vw,24px);
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(140%);
    backdrop-filter:blur(30px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    max-height:min(62vh,540px);
    animation:rise 1.4s .18s cubic-bezier(.16,1,.3,1) both;
  }
  .panel h2{
    font-size:clamp(10.5px,.9vw,12px);
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--faint);
  }

  .log{
    flex:1;
    min-height:120px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    font-size:clamp(13px,1.02vw,15px);
    line-height:1.55;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.18) transparent;
  }
  .log::-webkit-scrollbar{width:5px}
  .log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}

  .msg{max-width:100%}
  .msg.me{color:var(--dim)}
  .msg.me::before{content:"—  ";color:var(--faint)}
  .msg.ai{color:var(--ink)}

  .composer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 6px 6px 16px;
    border:1px solid var(--line);
    border-radius:100px;
    background:rgba(0,0,0,.35);
  }
  .composer input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:clamp(13px,1.02vw,15px);
    padding:8px 0;
  }
  .composer input::placeholder{color:var(--faint)}


  .mic{
    flex:none;
    width:42px;height:42px;
    display:grid;place-items:center;
    border:0;
    border-radius:50%;
    background:var(--ink);
    color:#000;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease;
  }
  .mic:hover{transform:scale(1.06)}
  .mic svg{width:19px;height:19px}
  .mic.live{
    background:#ff453a;color:#fff;
    box-shadow:0 0 0 0 rgba(255,69,58,.55);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 16px rgba(255,69,58,0)}
    100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}
  }

  .hint{
    font-size:clamp(10.5px,.85vw,12px);
    letter-spacing:.04em;
    color:var(--faint);
    text-align:center;
  }

  /* ---------- узкий экран ---------- */
  @media (max-width:900px){
    /* Фото отдаёт место панели, а не наоборот: поле ввода с микрофоном
       всегда должно быть на экране, оно тут главное. */
    .stage{
      grid-template-columns:1fr;
      grid-template-rows:minmax(0,1fr) auto;
      align-items:stretch;
      gap:10px;
      padding:0 14px max(12px, env(safe-area-inset-bottom));
    }
    .figure{min-height:0;overflow:hidden}
    .figure img{
      /* на телефоне кадрируем по высоте: бока у снимка пустые, их не жалко,
         зато фигура заполняет экран. width:100% держит страницу в рамках —
         без него картинка 2048x1920 вылезает вправо вместе с микрофоном */
      width:100%;
      height:100%;
      max-width:100%;
      object-fit:cover;
      object-position:center 42%;
      -webkit-mask-image:radial-gradient(ellipse 62% 88% at 50% 44%, #000 54%, rgba(0,0,0,.6) 80%, transparent 100%);
      mask-image:radial-gradient(ellipse 62% 88% at 50% 44%, #000 54%, rgba(0,0,0,.6) 80%, transparent 100%);
    }
    .panel{
      max-height:none;
      gap:10px;
      padding:14px;
      border-radius:18px;
    }
    .panel h2{display:none}
    .log{
      min-height:0;
      max-height:26vh;
      font-size:14px;
    }
    .hint{display:none}
    header{padding:12px 14px;gap:10px}
    .name{font-size:11px;letter-spacing:.1em}
    .cv{padding:.55em 1em;font-size:11px}
    .stage,.panel,.composer{min-width:0}
  }

  /* очень узкие телефоны: имя в шапке уступает место кнопкам */
  @media (max-width:400px){
    .name{display:none}
  }

  /* Совсем низкие экраны в альбомной ориентации: фото уводим, оставляем диалог */
  @media (max-height:460px) and (max-width:900px){
    .figure{display:none}
    .stage{grid-template-rows:auto}
    .log{max-height:38vh}
  }
</style>
</head>
<body>

<header>
  <div class="name">Denis Kuznetsov</div>
  <div class="nav">
    <div class="lang">
      <a href="index.html">FI</a><span>·</span><a class="on" href="index-en.html">EN</a>
    </div>
    <a class="cv" href="cv-en.html">CV</a>
  </div>
</header>

<main class="stage">

  <div class="figure">
    <img src="avatar.png" alt="Denis Kuznetsov">
  </div>

  <section class="panel">
    <h2>Ask me</h2>

    <div class="log" id="log">
      <div class="msg ai">Hi. Ask anything about what I do — speak or type, in any language you like.</div>
    </div>

    <form class="composer" id="form">
      <input id="q" type="text" autocomplete="off" placeholder="Type your question…">
      <button class="mic" id="mic" type="button" aria-label="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3.5"/>
        </svg>
      </button>
    </form>

    <div class="hint" id="hint">Press the microphone and speak</div>
  </section>

</main>

<script>
  const log  = document.getElementById('log');
  const form = document.getElementById('form');
  const q    = document.getElementById('q');
  const mic  = document.getElementById('mic');
  const hint = document.getElementById('hint');

  function say(text, who){
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  // Адрес воркера. Ключа Google здесь нет и быть не может —
  // страница обращается только сюда, воркер сам ходит к модели.
  const WORKER = 'https://round-scene-4de7.carbo-lignum.workers.dev';

  const TXT = {
    down:  'The connection is down right now. Write directly: carbo.lignum@gmail.com',
    idle:  'Press the microphone and speak',
    rec:   'Recording… press to stop',
    work:  'Listening…',
    voice: 'voice message',
    noMic: 'Microphone unavailable',
    long:  'The message is too long'
  };

  const history = [];
  let busy = false;

  // Один путь наружу и для текста, и для звука.
  async function send(payload, label){
    if(busy) return;
    busy = true;

    say(label, 'me');
    const dots = document.createElement('div');
    dots.className = 'msg ai';
    dots.style.opacity = '.45';
    dots.textContent = '…';
    log.appendChild(dots);
    log.scrollTop = log.scrollHeight;

    try{
      const r = await fetch(WORKER, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({ history: history.slice() }, payload))
      });
      const d = await r.json();
      dots.remove();
      if(d.reply){
        say(d.reply, 'ai');
        if(payload.message) history.push({role:'me', text:payload.message});
        history.push({role:'ai', text:d.reply});
      } else {
        say(d.error === 'audio_too_long' ? TXT.long : TXT.down, 'ai');
      }
    }catch(err){
      dots.remove();
      say(TXT.down, 'ai');
    }finally{
      busy = false;
      hint.textContent = TXT.idle;
    }
  }

  function ask(text){
    text = text.trim();
    if(!text) return;
    q.value = '';
    send({ message:text }, text);
  }

  form.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });

  /* ------------------------------------------------------------------
     ГОЛОС. Браузерное распознавание НЕ используется: ему надо заранее
     назвать язык, а заранее неизвестно, на каком языке заговорит
     посетитель. Вместо этого пишем звук и отдаём его модели как есть —
     она мультимодальная, слышит сама и отвечает на языке говорящего.

       MediaRecorder → WAV 16 кГц → base64 → воркер → Gemini (inlineData)
     ------------------------------------------------------------------ */

  const MAX_SECONDS = 45;
  let mr = null, chunks = [], stream = null, stopTimer = null;

  function wavFromSamples(samples, rate){
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const put = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    put(0,'RIFF');  v.setUint32(4, 36 + samples.length*2, true);
    put(8,'WAVE');  put(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
    v.setUint16(32,2,true); v.setUint16(34,16,true);
    put(36,'data'); v.setUint32(40, samples.length*2, true);
    let o = 44;
    for(let i=0;i<samples.length;i++,o+=2){
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true);
    }
    return new Blob([buf], { type:'audio/wav' });
  }

  async function toWav16k(blob){
    const ab = await blob.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const decoded = await ac.decodeAudioData(ab);
    ac.close();
    const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * 16000)), 16000);
    const src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start(0);
    const out = await off.startRendering();
    return wavFromSamples(out.getChannelData(0), 16000);
  }

  function toBase64(blob){
    return new Promise(res => {
      const r = new FileReader();
      r.onloadend = () => res(String(r.result).split(',')[1]);
      r.readAsDataURL(blob);
    });
  }

  function stopStream(){
    if(stopTimer){ clearTimeout(stopTimer); stopTimer = null; }
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    mic.classList.remove('live');
  }

  async function startRecording(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }catch(err){
      hint.textContent = TXT.noMic;
      return;
    }
    chunks = [];
    mr = new MediaRecorder(stream);
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stopStream();
      hint.textContent = TXT.work;
      try{
        const raw = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        if(raw.size < 1200){ hint.textContent = TXT.idle; return; }
        const wav = await toWav16k(raw);
        const b64 = await toBase64(wav);
        await send({ audio:b64 }, '🎙 ' + TXT.voice);
      }catch(err){
        hint.textContent = TXT.idle;
        say(TXT.down, 'ai');
      }
    };
    mr.start();
    mic.classList.add('live');
    hint.textContent = TXT.rec;
    stopTimer = setTimeout(() => { if(mr && mr.state === 'recording') mr.stop(); }, MAX_SECONDS * 1000);
  }

  if(!navigator.mediaDevices || !window.MediaRecorder){
    mic.style.display = 'none';
  } else {
    mic.addEventListener('click', () => {
      if(busy) return;
      if(mr && mr.state === 'recording'){ mr.stop(); return; }
      startRecording();
    });
  }
</script>

</body>
</html>
